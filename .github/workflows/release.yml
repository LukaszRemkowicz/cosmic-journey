name: Release

on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}

jobs:
  release:
    name: Tag and deploy
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Create and verify version tag
        id: version_tag
        run: |
          npm run release:tag
          tag="v$(node -p "require('./package.json').version")"
          if [ "$(git rev-parse "refs/tags/$tag^{commit}")" = "$GITHUB_SHA" ]; then
            echo "deploy=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Build for Cloudflare Pages
        if: steps.version_tag.outputs.deploy == 'true'
        env:
          SITE_URL: https://cosmicjourney.lukaszremkowicz.com
          GA_ID: ${{ vars.GA_ID }}
        run: |
          npm ci
          npm run build
      - name: Deploy to Cloudflare Pages
        if: steps.version_tag.outputs.deploy == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npx --yes wrangler@4.158.0 pages deploy dist \
            --project-name cosmic-journey --branch main \
            --commit-hash "$GITHUB_SHA"
