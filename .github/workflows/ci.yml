name: CI

on:
  pull_request:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  quality:
    name: Validate code and build
    uses: LukaszRemkowicz/ci-cd/.github/workflows/node-quality.yml@324b134fd8c2601c5d155a74ab2935f36976f475
    with:
      node_version: '24'
      lint_command: npm run check:version
      format_check_command: git show --format= --check --diff-merges=first-parent HEAD
      type_check_command: SITE_URL=https://ci.example.com npm run build

  tests:
    name: Run unit tests
    uses: LukaszRemkowicz/ci-cd/.github/workflows/node-tests.yml@324b134fd8c2601c5d155a74ab2935f36976f475
    with:
      node_version: '24'
      test_command: SITE_URL=https://ci.example.com npm test

  container:
    name: Docker smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check release script syntax
        run: |
          for script in scripts/release/*.sh; do
            bash -n "$script"
          done
      - name: Validate Compose configuration
        run: docker compose config --quiet
      - name: Validate production Compose configuration
        env:
          DOMAIN: cosmic.example.com
        run: docker compose -f docker-compose.yaml -f docker-compose.prod.yaml config --quiet
      - name: Build container image
        env:
          SITE_URL: https://ci.example.com
        run: docker build --build-arg SITE_URL --tag cosmic-journey:ci .
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Smoke-test static HTTP container
        env:
          COSMIC_CONTAINER_NAME: cosmic-journey-ci-${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          set -eu
          cleanup() {
            docker logs "$COSMIC_CONTAINER_NAME" || true
            docker rm --force "$COSMIC_CONTAINER_NAME" >/dev/null 2>&1 || true
          }
          trap cleanup EXIT
          docker run --detach --name "$COSMIC_CONTAINER_NAME" --publish 127.0.0.1:8080:8080 cosmic-journey:ci
          curl --fail --silent --show-error --retry 30 --retry-connrefused --retry-all-errors --retry-delay 1 --retry-max-time 45 --max-time 5 http://127.0.0.1:8080/ >/dev/null
          npm run test:http
